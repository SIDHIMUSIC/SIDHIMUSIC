<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #070b16; }
      .text { fill: #f8f9fa; font-family: system-ui, sans-serif; }
      .accent { fill: #247bff; }
      .crimson { fill: #ff354f; }
      .typing { animation: type 3s steps(20) infinite alternate; }
      @keyframes type { from { width: 0; } to { width: 100%; } }
    </style>
  </defs>
  <rect class="bg" width="800" height="400" rx="20"/>
  <text class="text" x="50" y="80" font-size="28" font-weight="bold">Hey, I'm</text>
  <text class="accent" x="50" y="140" font-size="64" font-weight="900">ASHU</text>
  <text class="crimson" x="50" y="200" font-size="24">Developer & Mathematics Educator</text>
  <text class="text" x="50" y="250" font-size="18">Building Telegram bots, interactive web apps & teaching maths</text>
  <text class="text" x="50" y="300" font-size="16">📍 Patna, Bihar | 💻 SIDHIMUSIC</text>
  <!-- Portrait placeholder - replace with embedded id.png -->
  <circle cx="650" cy="180" r="80" fill="#1a1f2e" stroke="#247bff" stroke-width="4"/>
  <text class="text" x="650" y="185" text-anchor="middle" font-size="14">Portrait</text>
</svg>
