<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Harry — animated developer profile</title><desc id="d">Animated dark navy profile banner with blue and red motion accents.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#101d35"/></linearGradient><linearGradient id="edge"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff405c"/></linearGradient><radialGradient id="glow"><stop stop-color="#247bff" stop-opacity=".45"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><rect x="2" y="2" width="1196" height="416" rx="26" fill="none" stroke="url(#edge)" stroke-width="2"/><circle cx="1010" cy="100" r="230" fill="url(#glow)"><animate attributeName="cx" values="990;1080;990" dur="9s" repeatCount="indefinite"/></circle><g fill="none" stroke="#247bff" stroke-opacity=".28"><path d="M730 0 L980 420"><animate attributeName="stroke-opacity" values=".08;.45;.08" dur="4s" repeatCount="indefinite"/></path><path d="M820 0 L1070 420"/><path d="M910 0 L1160 420"/></g><text x="62" y="66" fill="#9eacc5" font-family="monospace" font-size="16" letter-spacing="4">SIDHIMUSIC / PERSONAL PROFILE</text><text x="60" y="165" fill="#f5f7ff" font-family="Arial,sans-serif" font-weight="800" font-size="70">HEY, I'M HARRY.</text><text x="64" y="215" fill="#4c91ff" font-family="monospace" font-size="23">STUDENT • CODER • GAMER</text><text x="64" y="260" fill="#c1cce0" font-family="Arial,sans-serif" font-size="20">Building web experiences, bots and creative projects.</text><path d="M64 298 H610" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 546;546 0;0 546" dur="5s" repeatCount="indefinite"/></path><text x="64" y="350" fill="#8d9db9" font-family="monospace" font-size="16">PATNA, BIHAR, INDIA  /  BUILD • CREATE • SHIP</text><g transform="translate(1000 295)"><circle r="48" fill="#0e1b31" stroke="#247bff" stroke-width="2"><animate attributeName="r" values="44;50;44" dur="3s" repeatCount="indefinite"/></circle><text x="0" y="9" text-anchor="middle" fill="#f5f7ff" font-family="monospace" font-size="22" font-weight="700">H.</text><circle r="62" fill="none" stroke="#ff405c" stroke-opacity=".7" stroke-dasharray="14 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></circle></g></svg>