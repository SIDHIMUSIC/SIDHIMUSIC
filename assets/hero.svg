<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #070b16; }
      .offwhite { fill: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
      .blue { fill: #247bff; }
      .crimson { fill: #ff354f; }
      .mask { mask: url(#nameMask); }
    </style>
    <mask id="nameMask">
      <rect x="0" y="0" width="0" height="100">
        <animate attributeName="width" from="0" to="400" dur="1.8s" fill="freeze" begin="0.4s"/>
      </rect>
    </mask>
  </defs>
  <rect class="bg" width="900" height="420" rx="24"/>
  <text class="offwhite" x="50" y="70" font-size="22">
    <tspan>Hey, I'm </tspan>
    <tspan class="blue">Ashu</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
  </text>
  <text class="blue mask" x="50" y="160" font-size="92" font-weight="900">ASHU</text>
  <text class="crimson" x="50" y="220" font-size="26" font-weight="600">
    <tspan>Developer</tspan>
    <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text class="crimson" x="50" y="220" font-size="26" font-weight="600" opacity="0">
    <tspan>Mathematics Educator</tspan>
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text class="crimson" x="50" y="220" font-size="26" font-weight="600" opacity="0">
    <tspan>Telegram Bot Builder</tspan>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text class="crimson" x="50" y="220" font-size="26" font-weight="600" opacity="0">
    <tspan>Web Experience Creator</tspan>
    <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text class="offwhite" x="50" y="270" font-size="18">Building interactive Telegram bots, web apps & teaching maths</text>
  <text class="offwhite" x="50" y="320" font-size="16">📍 Patna, Bihar  ·  💻 SIDHIMUSIC</text>
  <circle cx="720" cy="190" r="110" fill="#111827" stroke="#247bff" stroke-width="3"/>
  <text class="offwhite" x="720" y="195" text-anchor="middle" font-size="14">Portrait</text>
</svg>
