<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Harry's developer terminal</title><desc id="desc">Animated terminal card showing current learning focus and developer mindset.</desc><rect width="1200" height="330" rx="24" fill="#070c18" stroke="#263651" stroke-width="2"/><rect x="2" y="2" width="1196" height="48" rx="22" fill="#101b31"/><circle cx="30" cy="26" r="7" fill="#ff5269"/><circle cx="54" cy="26" r="7" fill="#f5c451"/><circle cx="78" cy="26" r="7" fill="#45d483"/><text x="112" y="32" fill="#9aa9c4" font-family="monospace" font-size="15">harry@sidhi-dev: ~/profile</text><text x="48" y="96" fill="#4c91ff" font-family="monospace" font-size="19">$ whoami</text><text x="48" y="133" fill="#f4f7ff" font-family="monospace" font-size="21">Student • Frontend Developer • Gamer</text><text x="48" y="178" fill="#4c91ff" font-family="monospace" font-size="19">$ current_focus</text><text x="48" y="215" fill="#b9c6dc" font-family="monospace" font-size="20">JavaScript / React / Python / Telegram bots</text><text x="48" y="260" fill="#4c91ff" font-family="monospace" font-size="19">$ git status</text><text x="48" y="296" fill="#45d483" font-family="monospace" font-size="19">Learning, building, improving<span><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></span> ▋</text></svg>